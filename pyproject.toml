[project]
name = "serve-review"
version = "0.1.0"
description = "Offline tennis serve detection and video extraction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "click>=8.1,<9",
    "mediapipe>=0.10.32,<0.11",
    "numpy==1.26.4",
    "scipy>=1.16,<1.17",
]

[project.scripts]
serve-review = "serve_review.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]
racketvision = [
    "albumentations>=2,<3",
    "chumpy==0.70",
    "huggingface-hub>=1,<2",
    "json-tricks>=3.17,<4",
    "mmcv==2.1.0",
    "mmdet==3.3.0",
    "mmengine==0.10.7",
    "mmpose==1.3.2",
    "munkres>=1.1,<2",
    "pandas>=3,<4",
    "parse>=1.20,<2",
    "pycocotools>=2,<3",
    "setuptools<81",
    "shapely>=2,<3",
    "terminaltables>=3,<4",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "tqdm>=4,<5",
    "xtcocotools>=1.14,<2",
]

[tool.uv]
find-links = ["https://download.openmmlab.com/mmcv/dist/cpu/torch2.1/index.html"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
mmcv = [
    { url = "https://download.openmmlab.com/mmcv/dist/cpu/torch2.1.0/mmcv-2.1.0-cp311-cp311-macosx_10_9_universal2.whl", marker = "sys_platform == 'darwin'" },
    { url = "https://download.openmmlab.com/mmcv/dist/cu121/torch2.1.0/mmcv-2.1.0-cp311-cp311-manylinux1_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.uv.extra-build-dependencies]
# chumpy's legacy setup imports pip without declaring it.
chumpy = ["pip"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
