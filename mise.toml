min_version = "2026.9.1"

[tools]
python = "3.11.16"
uv = "0.12.9"

[tasks.setup]
description = "Create the locked Python environment"
run = "uv sync --locked --all-groups"

[tasks.doctor]
description = "Check Python, FFmpeg, and project prerequisites"
run = "uv run --locked serve-review doctor"

[tasks.test]
description = "Run the offline pipeline tests"
run = "uv run --locked pytest"

[tasks.check]
description = "Run diagnostics and tests"
depends = ["doctor", "test"]

[tasks.process]
description = "Process a recording directory or single video beside its sources"
run = "uv run --locked serve-review process \"$@\""

[tasks.help]
description = "Show the repository command inventory"
run = """
echo "process: mise run process -- TARGET [--dry-run] [--force]"
echo "cut: uv run --locked serve-review cut VIDEO --padding 1 --output compilation [--dry-run] [--force]"
echo "analyze-serve: uv run --locked serve-review analyze-serve VIDEO --start-seconds S --end-seconds E [--dry-run] [--force]"
echo "probe: uv run --locked serve-review probe VIDEO"
echo "export: uv run --locked serve-review export VIDEO --ranges RANGES.json"
echo "extract-poses: uv run --locked serve-review extract-poses VIDEO"
echo "extract-world: uv run --locked serve-review extract-world VIDEO ..."
echo "phase-annotate: mise run phase-annotate -- ..."
echo "phase-evaluate: mise run phase-evaluate -- ..."
echo "doctor: mise run doctor"
echo "setup/test/check: mise run setup | mise run test | mise run check"
"""

[tasks.cut]
description = "Detect serves and export clips or a compilation"
run = "uv run --locked serve-review cut \"$@\""

[tasks.phase-annotate]
description = "Convert zero-based frame labels into a private phase annotation manifest"
run = "uv run --locked python tools/phase_annotations.py \"$@\""

[tasks.phase-evaluate]
description = "Evaluate checkpoints against a private annotation manifest"
run = "uv run --locked python tools/evaluate_checkpoints.py \"$@\""
