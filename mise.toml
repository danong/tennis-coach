min_version = "2026.9.1"

[tools]
python = "3.11.16"
uv = "0.12.9"

[tasks.setup]
description = "Create the locked Python environment"
run = "uv sync --locked --all-groups"

[tasks.setup-wsl-cuda]
description = "Adapt the existing WSL environment for the RTX 5070"
run = "bash tools/setup_wsl_cuda.sh"

[tasks.bootstrap]
description = "Fetch the pinned RacketVision source and verify model artifacts"
run = "uv run --locked python tools/bootstrap_runtime.py"

[tasks.doctor]
description = "Check Python, FFmpeg, and project prerequisites"
run = "uv run --locked serve-review doctor"

[tasks.test]
description = "Run the offline pipeline tests"
run = "uv run --locked pytest"

[tasks.check]
description = "Run diagnostics and tests"
depends = ["doctor", "test"]

[tasks.process]
description = "Process a recording directory or single video beside its sources"
run = "uv run --locked serve-review process \"$@\""

[tasks.annotate]
description = "Review and correct one processed recording session locally"
run = "uv run --locked serve-review annotate \"$@\""

[tasks.evaluate]
description = "Score reviewed serves and focused checkpoints in one session"
run = "uv run --locked serve-review evaluate \"$@\""

[tasks.help]
description = "Show serve-review command help"
run = "uv run --locked serve-review --help"

[tasks.cut]
description = "Detect serves and export clips or a compilation"
run = "uv run --locked serve-review cut \"$@\""

[tasks.phase-annotate]
description = "Convert zero-based frame labels into a private phase annotation manifest"
run = "uv run --locked serve-review dev phase-annotate \"$@\""

[tasks.phase-evaluate]
description = "Evaluate checkpoints against a private annotation manifest"
run = "uv run --locked serve-review dev phase-evaluate \"$@\""
